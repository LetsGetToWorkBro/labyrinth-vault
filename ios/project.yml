# XcodeGen manifest. `xcodegen generate` produces the .xcodeproj; the project
# file itself is not committed so that diffs stay reviewable.
name: LabyrinthVault
options:
  bundleIdPrefix: vision.labyrinth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  LabyrinthVault:
    type: application
    platform: iOS
    sources:
      - path: LabyrinthVault
    info:
      path: LabyrinthVault/Info.plist
      properties:
        CFBundleDisplayName: Labyrinth Vault
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # The one permission the app asks for. The camera is the only wire.
        NSCameraUsageDescription: >-
          The camera is the vault's only input. It reads QR codes from your
          companion device; nothing else, and nothing leaves through it.
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIRequiresFullScreen: true
        ENABLE_USER_SCRIPT_SANDBOXING: true
