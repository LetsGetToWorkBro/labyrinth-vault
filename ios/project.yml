# XcodeGen manifest. `xcodegen generate` produces the .xcodeproj; the project
# file itself is not committed so that diffs stay reviewable.
name: LabyrinthVault
options:
  bundleIdPrefix: vision.labyrinth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  LabyrinthVault:
    type: application
    platform: iOS
    sources:
      - path: LabyrinthVault
    info:
      path: LabyrinthVault/Info.plist
      properties:
        CFBundleDisplayName: Labyrinth Vault
        # Marketing version and build. The build number is what TestFlight
        # orders uploads by and it must rise on every one; scripts/ship.mjs
        # bumps it so that nobody has to remember.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Answered here so App Store Connect stops asking on every upload, and
        # answered YES because it is true. The vault encrypts a seed at rest
        # with Argon2id and XChaCha20-Poly1305. That is data confidentiality,
        # not one of the exempt uses, whatever is convenient to click. The
        # exemption it does qualify for is the mass market one, and the
        # paperwork that goes with it is written out in docs/shipping.md
        # rather than left as a shrug.
        ITSAppUsesNonExemptEncryption: true
        ITSEncryptionExportComplianceCode: ""

        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # The one permission the app asks for. The camera is the only wire.
        NSCameraUsageDescription: >-
          The camera is the vault's only input. It reads QR codes from your
          companion device; nothing else, and nothing leaves through it.
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIRequiresFullScreen: true
        ENABLE_USER_SCRIPT_SANDBOXING: true
        PRODUCT_BUNDLE_IDENTIFIER: vision.labyrinth.vault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The two halves ship as separate apps and must never be mistaken for
        # each other on a home screen. Named, not inferred from the target.
        PRODUCT_NAME: Labyrinth Vault
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0

  # The contract tests.
  #
  # These already run on any machine with a Swift toolchain, through
  # Package.swift and `npm run swift:check`: the model they cover imports
  # Foundation and nothing else, deliberately, so it needs no Xcode to compile.
  #
  # They are a target here as well because of what one of them checks. NFKD on
  # Linux comes from swift-corelibs-foundation; NFKD on a phone comes from
  # Apple's Foundation. Two implementations of the same Unicode annex, and only
  # one of them is the one your passphrase will actually go through. Agreement
  # on Linux is evidence. Agreement on the device is the thing that matters,
  # and it costs one ⌘U to find out.
  LabyrinthVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LabyrinthVaultTests
    dependencies:
      - target: LabyrinthVault
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true

schemes:
  LabyrinthVault:
    build:
      targets:
        LabyrinthVault: all
        LabyrinthVaultTests: [test]
    test:
      targets: [LabyrinthVaultTests]
    run:
      config: Debug
