# XcodeGen manifest. `xcodegen generate` produces the .xcodeproj; the project
# file itself is not committed so that diffs stay reviewable.
name: LabyrinthVault
options:
  bundleIdPrefix: vision.labyrinth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LabyrinthVaultCore:
    path: ..

# ## Signing, and why it lives here rather than in Xcode
#
# The `.xcodeproj` is generated and never committed, so a development team
# chosen in Xcode's Signing & Capabilities editor survives exactly until the
# next `xcodegen generate` and is then silently gone. The build after that
# fails with "Signing for LabyrinthVault requires a development team", which
# reads like a new problem rather than a setting that evaporated.
#
# So it comes from the environment and lands in the generated project every
# time. Export it once, in a shell profile:
#
#     export LABYRINTH_TEAM_ID=ABCDE12345
#
# The ten-character Team ID is in App Store Connect under Membership Details.
# Left unset the substitution is empty and the build fails with that same
# signing error, which is the honest outcome: there is no team, and the error
# says so rather than inventing one.
#
# **None of this is needed to type-check the code.** A simulator build signs
# with nothing, so it is the build to run while working through compiler
# errors; the team matters only for a device build, an archive and an upload.
settings:
  base:
    DEVELOPMENT_TEAM: ${LABYRINTH_TEAM_ID}
    CODE_SIGN_STYLE: Automatic

targets:
  LabyrinthVault:
    type: application
    platform: iOS
    sources:
      - path: LabyrinthVault
    dependencies:
      # The native Argon2id, and the vendored C under it. Taken as a local
      # Swift package rather than as loose files so that Package.swift stays
      # the single description of how that code is built: one set of compiler
      # flags, one ARGON2_NO_THREADS, one set of header search paths, checked
      # by `swift build` on every `npm test` rather than only by Xcode on a
      # Mac. Loose C files in the app target would have needed a bridging
      # header and a second copy of all of it.
      - package: LabyrinthVaultCore
        product: LabyrinthVaultKDF
    info:
      path: LabyrinthVault/Info.plist
      properties:
        CFBundleDisplayName: Labyrinth Vault
        # Marketing version and build. The build number is what TestFlight
        # orders uploads by and it must rise on every one; scripts/ship.mjs
        # bumps it so that nobody has to remember.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "11"
        # ## The export compliance answer is not here, and that is a retreat
        #
        # `ITSAppUsesNonExemptEncryption: true` was here, answered YES because
        # it is true: the vault encrypts a seed at rest with Argon2id and
        # XChaCha20-Poly1305, which is data confidentiality rather than any of
        # the exempt uses. Putting it in the plist meant App Store Connect
        # stopped asking on every upload.
        #
        # It also made every upload fail:
        #
        #     Invalid Export Compliance Code. The export compliance key value
        #     [] in the app's Info.plist doesn't match the key value of the
        #     app's export compliance documentation.
        #
        # Answering YES puts the app in the category that owes Apple
        # documentation, and Apple then compares the plist against whatever
        # that app record holds. Completing the App Encryption Documentation
        # wizard, which concluded no upload was required, did not settle it.
        # Four validation attempts, one message.
        #
        # So the key is gone and the question moves to App Store Connect,
        # where it is asked per build and there is no plist value left to
        # mismatch. **The answer there is still YES**, for the same reasons,
        # and docs/shipping.md holds that rather than this file, because a
        # form is not something a test can read.
        #
        # This is worse than what it replaces: an answer in a manifest is
        # version-controlled and an answer in a form is not. Put it back the
        # moment Apple's side is understood.
        # ITSEncryptionExportComplianceCode is deliberately absent rather than
        # present and empty. The key is for apps that went through CCATS and
        # were issued a code; 5D992.c mass market is not one, so there is no
        # code to put here. An empty string is not the same as no answer, and
        # App Store Connect validates the value rather than ignoring it, which
        # turns "we have nothing to declare" into a rejected upload. If Apple
        # ever issues a code, add the key back with it in.

        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # The camera is the only wire.
        NSCameraUsageDescription: >-
          The camera is the vault's only input. It reads QR codes from your
          companion device; nothing else, and nothing leaves through it.
        # Reached only if somebody ticks the box on the unlock screen. This
        # string and that box say the same thing, because a person who reads
        # only one of them should not be surprised by the other.
        NSFaceIDUsageDescription: >-
          Face ID unlocks the vault with the passphrase you chose to store on
          this device. It never leaves this phone, and the vault stays sealed
          under that same passphrase.
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIRequiresFullScreen: true
        ENABLE_USER_SCRIPT_SANDBOXING: true
        PRODUCT_BUNDLE_IDENTIFIER: vision.labyrinth.vault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ## No PRODUCT_NAME here, deliberately
        #
        # The two halves ship as separate apps and must never be mistaken for
        # each other on a home screen. That is what `CFBundleDisplayName`
        # above is for, and it is the key iOS actually reads for the label
        # under the icon.
        #
        # `PRODUCT_NAME: Labyrinth Vault` was set here as well, which is a
        # different thing: it renames the built product on disk, so the app
        # became `Labyrinth Vault.app/Labyrinth Vault`. XcodeGen derives the
        # test bundle's `TEST_HOST` from the *target* name, which is
        # `LabyrinthVault`, so it pointed at `LabyrinthVault.app/LabyrinthVault`
        # and the first ⌘U failed with "Could not find test host". The app
        # built fine; nothing was wrong with it; the tests simply had no host
        # to load into, and the tests are the half that checks NFKD on Apple's
        # own Foundation.
        #
        # So the display name does the naming and the product keeps the
        # target's name. A space in a path that a build setting has to quote
        # is a cost with no benefit here.
        CURRENT_PROJECT_VERSION: 11
        MARKETING_VERSION: 0.1.0

  # The contract tests.
  #
  # These already run on any machine with a Swift toolchain, through
  # Package.swift and `npm run swift:check`: the model they cover imports
  # Foundation and nothing else, deliberately, so it needs no Xcode to compile.
  #
  # They are a target here as well because of what one of them checks. NFKD on
  # Linux comes from swift-corelibs-foundation; NFKD on a phone comes from
  # Apple's Foundation. Two implementations of the same Unicode annex, and only
  # one of them is the one your passphrase will actually go through. Agreement
  # on Linux is evidence. Agreement on the device is the thing that matters,
  # and it costs one ⌘U to find out.
  LabyrinthVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LabyrinthVaultTests
    dependencies:
      - target: LabyrinthVault
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true

schemes:
  LabyrinthVault:
    build:
      targets:
        LabyrinthVault: all
        LabyrinthVaultTests: [test]
    test:
      targets: [LabyrinthVaultTests]
    run:
      config: Debug
